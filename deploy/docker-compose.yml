version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: keyboardstore-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-keyboardstore}
      MYSQL_USER: ${DB_USER:-keyboard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-keyboard_password}
    ports:
      - "3306:3306"
    volumes:
      # Mount thư mục lưu trữ dữ liệu MySQL bền vững
      - ../storage/mysql:/var/lib/mysql
      # Chạy file sql để khởi tạo database khi khởi tạo container lần đầu
      - ./mysql:/docker-entrypoint-initdb.d
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: keyboardstore-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # Mount thư mục lưu trữ dữ liệu Redis cache bền vững
      - ../storage/redis:/data
    networks:
      - app-network

  backend:
    build:
      context: ../
      dockerfile: KeyboardStoreAPI.API/Dockerfile
    container_name: keyboardstore-backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${DB_DATABASE:-keyboardstore};User Id=${DB_USER:-keyboard_user};Password=${DB_PASSWORD:-keyboard_password};
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-DefaultSuperSecretKey1234567890!}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - VNPaySettings__TmnCode=${VNPAY_TMN_CODE}
      - VNPaySettings__HashSecret=${VNPAY_HASH_SECRET}
      - AppSettings__ApiBaseUrl=${API_BASE_URL:-http://localhost/api}
      - AppSettings__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost}
    depends_on:
      - db
      - redis
    volumes:
      # Mount thư mục uploads từ host vào wwwroot/uploads của container
      - ../storage/uploads:/app/wwwroot/uploads
      # Mount log ra ngoài host
      - ../storage/logs:/app/Logs
    networks:
      - app-network

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${FRONTEND_BASE_URL:-http://localhost}
        - API_BASE_URL=http://backend:8080
        - NEXT_PUBLIC_API_ASSET_URL=${FRONTEND_BASE_URL:-http://localhost}
        - NEXT_PUBLIC_ENABLE_VNPAY=true
    container_name: keyboardstore-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: keyboardstore-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: keyboardstore-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ../storage/mysql:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: keyboardstore-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - ../storage/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  backend:
    container_name: keyboardstore-backend
    restart: unless-stopped

    image: ${HARBOR_REGISTRY}/keyboardstore/backend:${IMAGE_TAG:-latest}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: >
        Server=db;
        Port=3306;
        Database=${DB_DATABASE};
        User Id=${DB_USER};
        Password=${DB_PASSWORD};

      ConnectionStrings__Redis: redis:6379

      JwtSettings__SecretKey: ${JWT_SECRET_KEY}

      EmailSettings__SenderEmail: ${EMAIL_SENDER_EMAIL}
      EmailSettings__Username: ${EMAIL_USERNAME}
      EmailSettings__Password: ${EMAIL_PASSWORD}

      VNPaySettings__TmnCode: ${VNPAY_TMN_CODE}
      VNPaySettings__HashSecret: ${VNPAY_HASH_SECRET}

      AppSettings__ApiBaseUrl: ${API_BASE_URL}
      AppSettings__FrontendBaseUrl: ${FRONTEND_BASE_URL}

    expose:
      - "8080"

    volumes:
      - ../storage/uploads:/app/wwwroot/uploads
      - ../storage/logs:/app/Logs

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - app-network

  frontend:
    container_name: keyboardstore-frontend
    restart: unless-stopped

    image: ${HARBOR_REGISTRY}/keyboardstore/frontend:${IMAGE_TAG:-latest}

    environment:
      # Biến server-side, đọc lúc runtime (không bị bake vào build như NEXT_PUBLIC_*)
      API_BASE_URL: http://backend:8080

    depends_on:
      backend:
        condition: service_started

    expose:
      - "3000"

    networks:
      - app-network

  nginx:
    image: nginx:1.28-alpine
    container_name: keyboardstore-nginx
    restart: unless-stopped

    depends_on:
      - backend
      - frontend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - devops

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================
  # JOB 1: Build & Push images
  # ============================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # ---------- Backend ----------
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/backend:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/backend:latest \
            -f KeyboardStoreAPI.API/Dockerfile \
            .

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/backend:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/backend:latest

      # ---------- Frontend ----------
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/frontend:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/frontend:latest \
            -f fe/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.FRONTEND_BASE_URL }} \
            --build-arg API_BASE_URL=http://backend:8080 \
            --build-arg NEXT_PUBLIC_API_ASSET_URL=${{ vars.FRONTEND_BASE_URL }} \
            --build-arg NEXT_PUBLIC_ENABLE_VNPAY=${{ vars.NEXT_PUBLIC_ENABLE_VNPAY }} \
            fe

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.HARBOR_REGISTRY }}/keyboardstore/frontend:latest

